# ===== nmap-port-scanner 配置文件 =====

# 要检测的端口，逗号分隔；支持范围写法，如 22,80-90,443
# 默认只扫 TCP；要扫 UDP 写成 U:53,T:22 这种格式
# 常见面板/服务默认端口：SSH=22、DNS=53、Web=80/443、
# X-UI/3x-ui=54321、哪吒面板=8008、Sub-Store 前端=3000、
# 常见伪装/CDN 端口=2053/2083/2087/2096/8443/8080
PORTS="22,53,80,443,8080,8443,2053,2083,2087,2096,54321,8008,3000"

# 结果输出目录（相对当前运行目录）；所有结果都集中到这里
OUT_DIR="output/ports"

# 额外 nmap 参数。
# -Pn 表示跳过 ping 主机发现、直接把网段里的地址都当作存活来扫；
# -T4 是较快的时间模板。网段很大想改慢或去掉 -Pn 可自行调整。
# -n 表示不做反向 DNS 解析，批量扫网段时更快。
EXTRA_OPTS="-Pn -T4 -n"
