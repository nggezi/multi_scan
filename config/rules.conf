# =============================================================
# 面板/服务指纹规则（纯 GET 只读探测，不做任何登录尝试）
#
# 写法：
#   [服务id]             # 输出文件就叫 <服务id>.txt
#   name = 中文名
#   title = 关键词        # 页面 <title>，命中 +3 分
#   body  = 关键词        # 首页 HTML/JS 源码，命中 +2 分
#   header= 关键词        # 响应头，命中 +1 分
#   probe_path = /xxx    # 额外探测路径（GET）
#   probe_body = 关键词   # 该路径响应正文/响应头含这些词才算命中，命中 +3 分
#   probe_status = 200,401,403,302
#   probe_any = yes      # yes = 首页没线索也做该探测；no = 首页有线索才做
#   min_score = 3        # 低于此分不输出
#
# 关键词用英文逗号分隔，匹配不区分大小写、按子串匹配。
# 建议先在小网段验证一轮，命中过泛/过窄时在这里加减关键词即可。
# =============================================================

[x-ui]
name = X-UI / 3x-ui 面板
title = x-ui, 3x-ui
body = x-ui, 3x-ui, /xui/
header = x-ui, xui
probe_path = /xui/inbound/list
probe_body = x-ui, xui, 未登录, msg, success, login
probe_status = 200, 401, 403, 302
probe_any = yes
min_score = 3

[nezha]
name = 哪吒监控 / Nezha
title = nezha, 哪吒
body = nezha, 哪吒, /api/v1/server
header =
probe_path = /api/v1/login
probe_body = nezha, 哪吒, method not allowed, 405
probe_status = 200, 404, 405
probe_any = no
min_score = 3

[hui]
name = HUI 面板
title = hui, hui面板
body = hui, /hui/
header =
probe_path = /hui/auth/login
probe_body = hui, /hui/, success, msg
probe_status = 200, 401, 403, 405
probe_any = no
min_score = 3

[xiandan]
name = 咸蛋 / Xboard 面板
title = xboard, 咸蛋
body = xboard, 咸蛋
header =
probe_path = /login
probe_body = xboard, 咸蛋
probe_status = 200
probe_any = no
min_score = 3

[sui]
name = SUI 面板
title = sui, s-ui
body = s-ui, /sui, sui-
header =
probe_path = /app/api/login
probe_body = sui, s-ui, success, msg
probe_status = 200, 401, 403, 405
probe_any = no
min_score = 3

[substore]
name = Sub-Store 订阅管理
title = sub-store, substore, sub store
body = sub-store, substore, sub store, /api/utils/env
header =
probe_path = /api/utils/env
probe_body = "status":"success", success, data, sub-store, substore
probe_status = 200
probe_any = yes
min_score = 3

[openwrt]
name = OpenWrt / iStoreOS 路由器
title = openwrt, luci, istoreos, lua configuration
body = openwrt, luci, istoreos, lua configuration, /cgi-bin/luci/
header =
probe_path = /cgi-bin/luci/
probe_body = openwrt, luci, istoreos, lua configuration
probe_status = 200, 401, 403
probe_any = yes
min_score = 3
