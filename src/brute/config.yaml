# =============================================================================
#  X-UI 混合爆破工具 — 配置文件
# =============================================================================
#  优先级: 环境变量 > config.yaml > 代码默认值
#  改完保存即生效，不需要改 Python 代码
# =============================================================================

# ---------------------------------------------------------------------------
#  爆破模式
# ---------------------------------------------------------------------------
#  1 = XUI面板       POST /login
#  2 = 哪吒面板      POST /api/v1/login
#  3 = HUI面板       POST /hui/auth/login
#  4 = 咸蛋面板      POST /login
#  5 = SUI面板       POST /app/api/login
#  6 = SSH爆破       SSH 直连 + 蜜罐检测
#  7 = Sub Store     GET 路径探测
#  8 = OpenWrt       POST /cgi-bin/luci/
#  设为 0 或不设则启动后交互式选择
#  环境变量: XUI_MODE
# ---------------------------------------------------------------------------
XUI_MODE: 0

# ---------------------------------------------------------------------------
#  目标文件路径，每行一个目标，支持以下格式混写:
#    192.168.1.1:443                IP:Port
#    10.0.0.1                       无端口自动补 :443
#    10.0.0.0/30:8080               CIDR 网段，自动展开为 4 个 IP
#    172.16.0.0/24                  /24 自动展开为 256 个 IP
#    https://1.2.3.4:8443/login     URL 格式，路径不丢
#    https://10.0.0.0/30:9090/admin URL + CIDR 组合
#    # 这是注释                     以 # 开头会被跳过
#  环境变量: XUI_INPUT_FILE
# ---------------------------------------------------------------------------
XUI_INPUT_FILE: "1.txt"

# ---------------------------------------------------------------------------
#  并发线程数（Go 协程数）
#  越大越快，但也越容易被目标服务器封禁 IP
#  建议: 测试环境 500~1000，生产环境 100~250
#  环境变量: XUI_THREADS
# ---------------------------------------------------------------------------
XUI_THREADS: 250

# ---------------------------------------------------------------------------
#  每批处理的目标数量
#  Go 内部把所有目标分成多批，批内并发、批间串行
#  环境变量: XUI_BATCH_SIZE
# ---------------------------------------------------------------------------
XUI_BATCH_SIZE: 1000

# ---------------------------------------------------------------------------
#  输入文件拆分行数
#  10 万行目标如果一次全扔给 Go，内存扛不住
#  拆成小份 → 逐份爆破 → 合并结果，小内存机器也能跑
#  机器内存 < 1G 建议改小到 1000~2000
#  环境变量: XUI_LINES_PER_FILE
# ---------------------------------------------------------------------------
XUI_LINES_PER_FILE: 5000

# ---------------------------------------------------------------------------
#  分片间冷却时间（秒）
#  每个分片爆破完休息一下，给目标服务器喘息时间
#  环境变量: XUI_SLEEP_SECONDS
# ---------------------------------------------------------------------------
XUI_SLEEP_SECONDS: 2

# ---------------------------------------------------------------------------
#  自定义用户名字典文件路径，每行一个用户名
#  不设则使用各模式内置默认:
#    模式 1,2,4,5 → admin
#    模式 3       → sysadmin
#    模式 6,8     → root
#    模式 7       → (内置默认)
#  环境变量: XUI_USERNAME_FILE
# ---------------------------------------------------------------------------
# XUI_USERNAME_FILE: "usernames.txt"

# ---------------------------------------------------------------------------
#  自定义密码字典文件路径，每行一个密码
#  不设则使用各模式内置默认
#  环境变量: XUI_PASSWORD_FILE
# ---------------------------------------------------------------------------
# XUI_PASSWORD_FILE: "passwords.txt"

# ---------------------------------------------------------------------------
#  是否跳过 Excel 生成（IP 地理信息查询）
#  true  → 纯爆破更快，跳过 ip-api.com 查询
#  false → 生成 .xlsx 报告，含国家/城市/ISP 列
#  环境变量: XUI_NO_EXCEL
# ---------------------------------------------------------------------------
XUI_NO_EXCEL: false

# ---------------------------------------------------------------------------
#  Telegram Bot Token
#  从 @BotFather 创建 Bot 后获取，格式: 123456789:ABCdef...
#  设了此项 + TG_CHAT_ID → 爆破完成后自动上传结果文件到 Telegram
#  不设 → 跳过 Telegram 通知
#  环境变量: TG_BOT_TOKEN
# ---------------------------------------------------------------------------
# TG_BOT_TOKEN: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"

# ---------------------------------------------------------------------------
#  Telegram Chat ID（你的用户 ID 或群组 ID）
#  获取方式: 给 @userinfobot 发消息即可
#  环境变量: TG_CHAT_ID
# ---------------------------------------------------------------------------
# TG_CHAT_ID: "789012345"

# ---------------------------------------------------------------------------
#  Go 模块代理（国内网络加速）
#  国内建议设: https://goproxy.cn,direct
#  不设则自动检测网络位置
#  环境变量: GOPROXY
# ---------------------------------------------------------------------------
# GOPROXY: "https://goproxy.cn,direct"

# ---------------------------------------------------------------------------
#  Go 校验数据库（国内网络加速）
#  国内建议设: sum.golang.google.cn
#  不设则自动检测网络位置
#  环境变量: GOSUMDB
# ---------------------------------------------------------------------------
# GOSUMDB: "sum.golang.google.cn"

# ---------------------------------------------------------------------------
#  网段来源 URL（用于 scan_all.sh 交互式拉取）
#  格式: 别名|URL，每行一条
#  scan_all.sh 不传参启动时，展示菜单供选择拉取哪些
# ---------------------------------------------------------------------------
SUBNET_URLS:
  国内资产|https://example.com/assets/cn_subnets.txt
  海外资产|https://example.com/assets/overseas_subnets.txt
  CDN厂商|https://example.com/assets/cdn_ranges.txt
  云服务商|https://example.com/assets/cloud_ranges.txt
  运营商|https://example.com/assets/isp_ranges.txt
